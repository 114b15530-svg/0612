<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Planet Quiz</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>

<body>

<div id="ui">

    <!-- Landing -->
    <div id="landing" class="screen">
        <h1>🌌 Discover Your Digital Planet</h1>

        <p>回答 8 個問題，生成你的專屬星球</p>

        <button id="startBtn">開始測驗</button>
    </div>

    <!-- Quiz -->
    <div id="quiz" class="screen hidden">

        <h2 id="questionNumber"></h2>
        <h3 id="questionText"></h3>

        <div class="choices">
            <button id="choiceA"></button>
            <button id="choiceB"></button>
        </div>

        <!-- ⭐ 新增：上一題 -->
        <button id="backBtn" class="back-btn">← 上一題</button>

    </div>

    <!-- Result -->
    <div id="result" class="screen hidden">

        <h1 id="planetName"></h1>
        <p id="planetDescription"></p>

        <button id="restartBtn">重新測驗</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
